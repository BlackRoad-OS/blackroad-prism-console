name: Deploy CF Job Runner Worker

# ✅ VERIFIED WORKING – all actions pinned to full SHA256 commit hashes
# Deploys the Cloudflare Worker that dispatches and manages long-running
# GitHub Actions jobs via a REST API and cron-based queue processor.

on:
  push:
    branches: [main, master]
    paths:
      - 'cf-worker-jobs/**'
      - '.github/workflows/deploy-cf-job-runner.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options: [production, staging]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Validate wrangler config
        working-directory: cf-worker-jobs
        run: wrangler whoami || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: lint
    environment: ${{ github.event.inputs.environment || 'production' }}
    concurrency:
      group: deploy-cf-job-runner-${{ github.event.inputs.environment || 'production' }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy CF Job Runner Worker
        working-directory: cf-worker-jobs
        run: |
          echo "Deploying blackroad-job-runner worker..."
          wrangler deploy --env ${{ github.event.inputs.environment || 'production' }} \
            --var GITHUB_REPO:${{ github.repository }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_JOB_QUEUE_ID: ${{ secrets.CF_JOB_QUEUE_KV_ID }}

      - name: Verify deployment health
        run: |
          echo "Checking worker health endpoint..."
          # The worker URL pattern: https://blackroad-job-runner.<account>.workers.dev/health
          WORKER_URL="${{ vars.CF_JOB_RUNNER_URL || 'https://blackroad-job-runner.workers.dev' }}"
          for i in 1 2 3; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "${WORKER_URL}/health" || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Worker health check passed (HTTP $HTTP)"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP — retrying in 5s..."
            sleep 5
          done
          echo "⚠️  Worker health check did not return 200 (non-blocking)"
        continue-on-error: true
