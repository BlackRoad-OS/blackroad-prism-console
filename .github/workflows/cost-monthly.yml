name: Cost Monthly (Std Roll → Variance → GL Export)
on:
  schedule: [{ cron: "45 9 1 * *" }]
  workflow_dispatch:
jobs:
  cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: '20' }
      - run: npm ci --prefix apps/api
      - run: npx tsx scripts/cost/roll_standard.ts
      - run: npx tsx scripts/cost/variance.ts
      - run: npx tsx scripts/cost/export_gl.ts
