name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trigger Cloudflare Pages deployment
        run: |
          if [ -n "${{ secrets.CF_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
            echo "✅ Cloudflare Pages deploy triggered"
          else
            echo "CF_DEPLOY_HOOK not set — skipping Cloudflare deploy"
          fi

      - name: Notify on success
        if: success()
        run: echo "✅ Deploy completed for ${{ github.sha }}"
