name: reusable-test-harness

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      version:
        required: true
        type: string
      test:
        required: true
        type: string

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          language: ${{ inputs.language }}
          version: ${{ inputs.version }}
          test_command: ${{ inputs.test }}

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@567cc7f8dcea3eba5da355f6efc287ee8f3cfb6f # v2.18.0
        with:
          files: |
            **/junit-*.xml
