name: CPM Monthly (Forecast + Variance + Pack)
on:
  schedule: [{ cron: "15 6 1 * *" }]
  workflow_dispatch:
jobs:
  cpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: '20' }
      - run: node scripts/cpm/evaluate_trees.ts
      - run: node scripts/cpm/run_forecasts.ts
      - run: node scripts/cpm/variance_calc.ts
      - run: node scripts/cpm/make_pack.ts
      - uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842 # v5
        with:
          commit_message: "chore(cpm): monthly forecast, variance, pack"
          file_pattern: "data/cpm/**"
