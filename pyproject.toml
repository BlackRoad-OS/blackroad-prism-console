[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackroad-prism-console"
version = "0.1.0"
description = "Quantum computing teaching lab and agent orchestration toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "BlackRoad Labs", email = "labs@example.com" }]
dependencies = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "sympy>=1.12",
    "torch>=2.2,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.15.1,<0.22",
    "pydantic>=2.6.4,<3",
    "hypothesis>=6.103.4,<7",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "regopy>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.2",
]
qiskit = ["qiskit", "qiskit-aer", "qiskit-ibm-runtime"]
viz = ["matplotlib>=3.8,<4"]

[project.urls]
Homepage = "https://example.com/quantum-lab"

[project.scripts]
blackroad = "cli.blackroad:cli"
blackroad-agent = "agent.daemon:main"
blackroad-api = "agent.api:main"
blackroad-dashboard = "agent.dashboard:main"
brc = "cli.console:main"
blackroad-console = "cli.console:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
packages = ["orchestrator", "bots", "config", "cli", "tools"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.setuptools]
packages = ["cli"]
include-package-data = true

[tool.setuptools.package-data]
agent = ["templates/*.html"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantum_lab*", "qlm_lab*"]
