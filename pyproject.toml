[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/lucidia_reason"]
addopts = "--ignore=srv/blackroad/examples --import-mode=importlib"

